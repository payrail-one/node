name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Enforce source size
        run: bash scripts/check-source-size.sh
      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check
      - name: Test workspace
        run: cargo +1.88.0 test --locked --workspace
      - name: Lint workspace
        run: cargo +1.88.0 clippy --locked --workspace --all-targets -- -D warnings

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build public-node image
        run: docker build --file Dockerfile.node --tag payrail/node:ci .
