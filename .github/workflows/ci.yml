name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Enforce source size
        run: bash scripts/check-source-size.sh
      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check
      - name: Test workspace
        run: cargo +1.88.0 test --locked --workspace
      - name: Lint workspace
        run: cargo +1.88.0 clippy --locked --workspace --all-targets -- -D warnings
