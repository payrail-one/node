[package]
name = "ethereum-bridge-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
ethereum-bridge-core = { path = "../../crates/ethereum-bridge-core" }
ethereum-bridge-observer-lmdb = { path = "../../crates/ethereum-bridge-observer-lmdb" }
ethereum-bridge-rpc = { path = "../../crates/ethereum-bridge-rpc" }
external-asset-core = { path = "../../crates/external-asset-core" }
external-asset-runtime-core = { path = "../../crates/external-asset-runtime-core" }
ledger-core = { path = "../../crates/ledger-core" }
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
